name: Respostas aos comentários

on:
  schedule:
    - cron: "15 */3 * * *"   # a cada 3 horas
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Só mostrar o que responderia"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: comments
  cancel-in-progress: false

env:
  TZ: America/Sao_Paulo
  PYTHONUNBUFFERED: "1"

jobs:
  reply:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Responde comentários
        env:
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_LOGIN: ${{ vars.IG_LOGIN || 'facebook' }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python comments.py ${{ inputs.dry_run && '--dry-run' || '' }}

      - name: Registra os comentários analisados
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/comments.json 2>/dev/null || true
          git diff --cached --quiet || (git commit -m "Comentários respondidos" && git pull --rebase -q && git push -q)
