name: Curiosidades do mês

on:
  schedule:
    - cron: "0 12 1 * *"   # dia 1º, 9h de Brasília: carrossel extra, longe do post das 12h
  workflow_dispatch:
    inputs:
      month:
        description: "Mês (AAAA-MM); vazio = mês atual"
        required: false
      dry_run:
        description: "Só conferir, sem publicar"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: daily-publish   # mesma fila da publicação diária: nunca dois commits ao mesmo tempo
  cancel-in-progress: false

env:
  TZ: America/Sao_Paulo
  PYTHONUNBUFFERED: "1"

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Define o mês
        run: |
          MONTH="${{ inputs.month }}"
          echo "MONTH=${MONTH:-$(date +%Y-%m)}" >> "$GITHUB_ENV"
          echo "DRY=${{ inputs.dry_run && '--dry-run' || '' }}" >> "$GITHUB_ENV"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Instala Chromium e fonte de emoji
        run: |
          sudo apt-get update -q && sudo apt-get install -y -q fonts-noto-color-emoji
          python -m playwright install --with-deps chromium

      - name: Gera o carrossel do mês
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          # Código 2 = reprovado no revisor: salva para você revisar; o publish.py não publica.
          python month.py --month "$MONTH" || [ $? -eq 2 ]
          python publish.py prepare --dir "output/mes-$MONTH"

      - name: Salva o conteúdo no repositório
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add output data
          git diff --cached --quiet || git commit -m "Curiosidades do mês: $MONTH"
          git pull --rebase -q && git push -q

      - name: Publica no Instagram (só carrossel)
        env:
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_LOGIN: ${{ vars.IG_LOGIN || 'facebook' }}
        run: |
          export MEDIA_BASE_URL="https://raw.githubusercontent.com/${{ github.repository }}/$(git rev-parse HEAD)"
          python publish.py noon --dir "output/mes-$MONTH" $DRY

      - name: Registra o que foi publicado
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add output/*/published.json 2>/dev/null || true
          git diff --cached --quiet || (git commit -m "Publicado: curiosidades de $MONTH" && git pull --rebase -q && git push -q)
