name: Renova token do Instagram

# O token de longa duração vale 60 dias; renovar toda semana mantém a folga.
on:
  schedule:
    - cron: "0 12 * * 1"   # segundas, 9h de Brasília
  workflow_dispatch:

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install httpx
      - name: Renova e grava o novo token nos secrets
        env:
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: |
          NEW=$(python -c "import os; from agent.instagram import refresh_token; print(refresh_token(os.environ['IG_ACCESS_TOKEN'])['access_token'])")
          echo "::add-mask::$NEW"
          gh secret set IG_ACCESS_TOKEN --repo "${{ github.repository }}" --body "$NEW"
          echo "Token renovado."
